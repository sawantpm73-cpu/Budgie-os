
name: Build BudgieOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Get BudgieOS files
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common dosfstools mtools

      - name: Build BudgieOS
        run: |
          sudo chmod +x build.sh auto/config config/hooks/live/*.hook.chroot
          sudo ./build.sh

      - name: Save ISO
        uses: actions/upload-artifact@v4
        with:
          name: BudgieOS-1.0-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7BudgieOS_1.0_Budgie_Theme.zip


#!/bin/bash
set -e

echo "Building BudgieOS Professional Edition..."

sudo apt-get update
sudo apt-get install -y live-build debootstrap

sudo lb config
sudo lb build

echo "BudgieOS ISO build finished!"
